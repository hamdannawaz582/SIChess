site_name: SIChess

theme:
  name: material
  palette:
    scheme: slate
    primary: teal
    accent: cyan

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - API Reference: api.md